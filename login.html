<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopee - Login</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1 class="logo">Mini Shopee</h1>

            <h2>Masuk ke akunmu</h2>
            <p class="subtitle">Gunakan username & password akunmu.</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                    >
                </div>

                <!-- JS akan mengisi pesan error di sini -->
                <p id="loginError" class="error-message"></p>

                <!-- JS akan menampilkan loading di sini -->
                <p id="loginLoading" class="loading-message">
                    Sedang memproses login...
                </p>

                <button type="submit" id="loginButton" class="login-button">
                    Masuk
                </button>

            </form>

        </div>

    </main>

</body>
</html>
