<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLESPACE - Login</title>

    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>
</head>

<body>

    <main class="login-page">

        <section class="login-visual">
            <div class="visual-content">
                <p class="eyebrow">WELCOME TO SOLESPACE</p>
                <h1>STEP INTO<br>YOUR STYLE.</h1>
                <p>
                    Discover sneakers, streetwear, and everyday essentials
                    made for your style.
                </p>
            </div>
        </section>

        <section class="login-section">

            <div class="login-box">

                <div class="logo">
                    SOLE<span>SPACE</span>
                </div>

                <div class="login-heading">
                    <h2>Welcome back</h2>
                    <p>Sign in to continue shopping.</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                    </div>

                    <!-- JS akan mengisi pesan error di sini -->
                    <p id="loginError" class="error-message"></p>

                    <!-- JS bisa menampilkan loading di sini -->
                    <p id="loginLoading" class="loading-message">
                        Signing you in...
                    </p>

                    <button type="submit" id="loginButton" class="login-button">
                        SIGN IN
                    </button>

                </form>

                <p class="login-note">
                    Shop your favorite products in one place.
                </p>

            </div>

        </section>

    </main>

</body>
</html>
