<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopee - Katalog</title>

    <link rel="stylesheet" href="style.css">
    <script src="products.js" defer></script>
</head>

<body>

    <!-- navbar -->
    <header class="navbar">

        <div class="logo">Mini Shopee</div>

        <div class="nav-search">
            <input
                type="text"
                id="searchInput"
                placeholder="Cari produk atau kategori..."
            >
        </div>

        <div class="nav-actions">

            <span id="userName" class="user-name">Halo, Shopper</span>

            <button id="cartButton" class="cart-button">
                Keranjang
                <span id="cartCount">0</span>
            </button>

            <button id="logoutButton" class="logout-button">
                Keluar
            </button>

        </div>

    </header>

    <!-- products -->
    <main id="products" class="products-section">

        <div class="section-header">

            <h2>Semua Produk</h2>

            <div class="product-controls">

                <select id="categoryFilter">
                    <option value="all">Semua Kategori</option>
                </select>

                <select id="sortSelect">
                    <option value="default">Urutkan</option>
                    <option value="price-low">Harga: Rendah ke Tinggi</option>
                    <option value="price-high">Harga: Tinggi ke Rendah</option>
                    <option value="rating-high">Rating: Tinggi ke Rendah</option>
                </select>

            </div>

        </div>

        <!-- eror -->
        <div id="globalError" class="global-error">
            Terjadi kesalahan saat memuat produk.
        </div>

        <!-- loading -->
        <div id="productLoading" class="product-loading">
            Memuat produk...
        </div>

        <!-- product grid  -->
        <div id="productGrid" class="product-grid">

            <!-- JavaScript akan memasukkan product card di sini -->

        </div>

        <!-- load more-->
        <div class="load-more-container">

            <button id="loadMoreButton" class="load-more-button">
                Muat Lebih Banyak
            </button>

        </div>

    </main>

    <!-- cart panel -->
    <aside id="cartPanel" class="cart-panel">

        <div class="cart-header">
            <h2>Keranjang Belanja</h2>
            <button id="closeCartButton" class="close-button">×</button>
        </div>

        <div id="cartItems" class="cart-items">
            <!-- JavaScript akan memasukkan item cart -->
        </div>

        <div class="cart-footer">

            <div class="cart-total-row">
                <span>Total</span>
                <strong id="cartTotal">Rp0</strong>
            </div>

            <button id="checkoutButton" class="checkout-button">
                Checkout
            </button>

        </div>

    </aside>

    <!-- cart overly -->
    <div id="cartOverlay" class="cart-overlay"></div>

    <!-- product detail modal -->
    <div id="productModal" class="modal">

        <div class="modal-content">

            <button id="closeModalButton" class="modal-close">×</button>

            <div id="modalProductContent">
                <!-- JavaScript akan memasukkan detail produk di sini -->
            </div>

        </div>

    </div>

    <!-- footer-->
    <footer class="footer">
        <p>Mini Shopee &copy; 2026</p>
    </footer>

</body>
</html>
